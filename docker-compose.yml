version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: te-grow-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-mongodb://mongo:27017/te-grow-dashboard}
      - CORS_ORIGIN=http://localhost:3000,http://localhost
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env:ro
    depends_on:
      - mongo
    networks:
      - te-grow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: te-grow-frontend
    ports:
      - "80:80"
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:5000/api
    depends_on:
      - backend
    networks:
      - te-grow-network
    restart: unless-stopped

  mongo:
    image: mongo:7-alpine
    container_name: te-grow-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=te-grow-dashboard
    volumes:
      - mongo-data:/data/db
    networks:
      - te-grow-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:

networks:
  te-grow-network:
    driver: bridge
